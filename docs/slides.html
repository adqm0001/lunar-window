<script>
const slides=[...document.querySelectorAll('figure')];let at=0;
function show(n){at=Math.max(0,Math.min(slides.length-1,n));slides.forEach((s,i)=>s.hidden=i!==at);document.getElementById('count').textContent=(at+1)+' / '+slides.length;document.getElementById('prev').disabled=at===0;document.getElementById('next').disabled=at===slides.length-1;location.hash=String(at+1);}
document.getElementById('prev').onclick=()=>show(at-1);document.getElementById('next').onclick=()=>show(at+1);
document.getElementById('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{}};
document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(at+1);}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(at-1);}if(e.key==='Home')show(0);if(e.key==='End')show(slides.length-1);});
show((Number(location.hash.slice(1))||1)-1);
</script>
